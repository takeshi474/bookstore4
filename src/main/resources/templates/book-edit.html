<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>books-title</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
      background-color: #e9ecef;
  }
  .msg {
      color: #dc3545;
      font-size: 0.85em;
  }
  .form-card {
      max-width: 700px;
      margin: 0 auto;
      padding-left: 50px;
      padding-right: 50px;
  }
</style>
</head>
<body>
<div class="container py-5">
<div class="card shadow-sm form-card">
    <div class="card-body p-4">
        <h1 class="h3 mb-4 text-center">📖 書籍データ修正</h1>

        <form th:action="@{/book/edit}" method="post" th:object="${bookForm}">

            <div class="row mb-3 align-items-start">
                <label class="col-sm-2 col-form-label">題　名</label>
                <div class="col-sm-9">
                    <input type="text" th:field="*{title}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <span th:errors="*{title}" class="msg invalid-feedback"></span>
                </div>
            </div>

            <div class="row mb-3 align-items-start">
                <label class="col-sm-2 col-form-label">発行日</label>
                <div class="col-sm-3">
                    <input type="date" th:field="*{date}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('date')} ? 'is-invalid'">
                    <span th:errors="*{date}" class="msg invalid-feedback"></span>
                </div>
            </div>

            <div class="row mb-3 align-items-start">
                <label class="col-sm-2 col-form-label">価　格</label>
                <div class="col-sm-3">
                    <div class="input-group">
                        <input type="number" th:field="*{price}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                        <span class="input-group-text">円</span>
                    </div>
                    <span th:errors="*{price}" class="msg d-block"></span>
                </div>
            </div>

            <div class="row mb-4 align-items-start">
                <label class="col-sm-2 col-form-label">タイプ</label>
                <div class="col-sm-9 pt-2">
                    <div class="form-check form-check-inline">
                        <input type="checkbox" th:field="*{mediaType}" value="印刷本"
                               class="form-check-input" id="mediaType1">
                        <label class="form-check-label" for="mediaType1">印刷本</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input type="checkbox" th:field="*{mediaType}" value="電子書籍"
                               class="form-check-input" id="mediaType2">
                        <label class="form-check-label" for="mediaType2">電子書籍</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input type="checkbox" th:field="*{mediaType}" value="オーディオブック"
                               class="form-check-input" id="mediaType3">
                        <label class="form-check-label" for="mediaType3">オーディオブック</label>
                    </div>

                    <span th:errors="*{mediaType}" class="msg d-block"></span>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-9 offset-sm-3 d-flex gap-2">
                    <input type="submit" value="修正" class="btn btn-primary">
					<a th:href="@{/book/list(
					    page=${bookForm.page},
					    size=${bookForm.size},
					    sort=${bookForm.sort},
					    keyword=${bookForm.keyword}
					)}"
					   class="btn btn-outline-secondary">
					    キャンセル
					</a>
                </div>
            </div>
			<input type="hidden" th:field="*{id}">
			<input type="hidden" th:field="*{page}">
			<input type="hidden" th:field="*{size}">
			<input type="hidden" th:field="*{sort}">
			<input type="hidden" th:field="*{keyword}">
        </form>
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
