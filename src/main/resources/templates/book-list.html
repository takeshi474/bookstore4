<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍リスト</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background-color: #f8f9fa; }
  .table-hover tbody tr:hover { background-color: #f1f5ff; }
</style>
</head>
<body>
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">📚 書籍リスト</h1>
        <a th:href="@{/book/create}" class="btn btn-primary">
            <i class="bi"></i> ＋ 新規作成
        </a>
    </div>
    
<div class="mb-3">

<th:block th:with="
    currentSort=${param.sort != null ? param.sort[0] : 'idAsc'},
    currentSize=${param.size != null ? param.size[0] : '10'}
">

    <!-- 検索 -->
    <form th:action="@{/book/list}" method="get"
          class="d-flex justify-content-end align-items-center mb-3">

        <input type="text"
               name="keyword"
               class="form-control w-auto"
               placeholder="書籍名を検索"
               th:value="${param.keyword}">

        <button type="submit" class="btn btn-primary ms-2">
            検索
        </button>

    </form>


    <!-- ソート・表示件数 -->
    <div class="d-flex justify-content-end align-items-center">

        <label for="sort" class="me-2 fw-semibold">並び替え：</label>

        <select id="sort" class="form-select w-auto"
                onchange="location.href=this.value">

            <option th:value="@{/book/list(
                        keyword=${param.keyword != null ? param.keyword[0] : ''},
                        sort='idAsc',
                        size=${currentSize})}"
                    th:selected="${currentSort == 'idAsc'}">
                ID昇順
            </option>

            <option th:value="@{/book/list(
                        keyword=${param.keyword != null ? param.keyword[0] : ''},
                        sort='idDesc',
                        size=${currentSize})}"
                    th:selected="${currentSort == 'idDesc'}">
                ID降順
            </option>

            <option th:value="@{/book/list(
                        keyword=${param.keyword != null ? param.keyword[0] : ''},
                        sort='priceAsc',
                        size=${currentSize})}"
                    th:selected="${currentSort == 'priceAsc'}">
                価格：安い順
            </option>

            <option th:value="@{/book/list(
                        keyword=${param.keyword != null ? param.keyword[0] : ''},
                        sort='priceDesc',
                        size=${currentSize})}"
                    th:selected="${currentSort == 'priceDesc'}">
                価格：高い順
            </option>

            <option th:value="@{/book/list(
                        keyword=${param.keyword != null ? param.keyword[0] : ''},
                        sort='dateAsc',
                        size=${currentSize})}"
                    th:selected="${currentSort == 'dateAsc'}">
                発行日：古い順
            </option>

            <option th:value="@{/book/list(
                        keyword=${param.keyword != null ? param.keyword[0] : ''},
                        sort='dateDesc',
                        size=${currentSize})}"
                    th:selected="${currentSort == 'dateDesc'}">
                発行日：新しい順
            </option>

        </select>


        <label for="size" class="ms-4 me-2 fw-semibold">表示件数：</label>

        <select id="size" class="form-select w-auto"
                onchange="location.href=this.value">

            <option th:value="@{/book/list(
                        keyword=${param.keyword != null ? param.keyword[0] : ''},
                        sort=${param.sort != null ? param.sort[0] : 'idAsc'},
                        size=10)}"
                    th:selected="${param.size == null or param.size[0] == '10'}">
                10件
            </option>

            <option th:value="@{/book/list(
                        keyword=${param.keyword != null ? param.keyword[0] : ''},
                        sort=${param.sort != null ? param.sort[0] : 'idAsc'},
                        size=20)}"
                    th:selected="${param.size != null and param.size[0] == '20'}">
                20件
            </option>

            <option th:value="@{/book/list(
                        keyword=${param.keyword != null ? param.keyword[0] : ''},
                        sort=${param.sort != null ? param.sort[0] : 'idAsc'},
                        size=30)}"
                    th:selected="${param.size != null and param.size[0] == '30'}">
                30件
            </option>

        </select>

    </div>

</th:block>

</div>
</th:block>

</div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">題名</th>
                        <th scope="col">発行日</th>
                        <th scope="col">価格</th>
                        <th scope="col">メディアタイプ</th>
                        <th scope="col" class="text-end">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book:${books}">
                        <td th:text="${book.id}">1</td>
                        <td th:text="${book.title}" class="fw-semibold">情報倫理</td>
                        <td th:text="${book.date}">2035-03-10</td>
                        <td th:text="${book.price} + ' 円'">3000 円</td>
                        <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${#strings.listJoin(book.mediaType, ', ')}">印刷本</span>
                        </td>
                        <td class="text-end">
							<a th:href="@{/book/{id}/edit(
							    id=${book.id},
							    page=${books.number},
							    size=${param.size != null ? param.size[0] : 10},
							    sort=${param.sort != null ? param.sort[0] : 'idAsc'},
							    keyword=${param.keyword != null ? param.keyword[0] : ''}
							)}"
							   class="btn btn-primary">
							    編集
							</a>
                            <a th:href="@{/book/{id}/delete (id=${book.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('本当に削除しますか？');">削除</a>
                        </td>
                    </tr>
					<tr th:if="${books.isEmpty()}">
					    <td colspan="6" class="text-center text-muted py-4">
					        <span th:if="${param.keyword != null and param.keyword[0] != ''}">
					            「<span th:text="${param.keyword[0]}"></span>」に一致する書籍がありません。
					        </span>
					        <span th:unless="${param.keyword != null and param.keyword[0] != ''}">
					            登録された書籍がありません。
					        </span>
					    </td>
					</tr>
                </tbody>
            </table>
        </div>
    </div>
<div class="d-flex justify-content-center mt-4"
	th:if="${books.totalPages > 1}">
    <nav aria-label="ページナビゲーション">
        <ul class="pagination">
	        <li class="page-item me-2"
			    th:classappend="${books.first} ? 'disabled'">
			
			    <a class="page-link"
			       th:href="@{/book/list(
			           page=${books.number - 1},
			           size=${param.size != null ? param.size[0] : 10},
			           sort=${param.sort != null ? param.sort[0] : 'idAsc'},
			           keyword=${param.keyword != null ? param.keyword[0] : ''}
			       )}">
			        前へ
			    </a>
			
			</li>
            <!-- 1ページ目 -->
            <li class="page-item"
                th:classappend="${books.number == 0} ? 'active'">
                <a class="page-link"
                   th:href="@{/book/list(
                       page=0,
                       size=${param.size != null ? param.size[0] : 10},
                       sort=${param.sort != null ? param.sort[0] : 'idAsc'},
                       keyword=${param.keyword != null ? param.keyword[0] : ''}
                   )}">
                    1
                </a>
            </li>

            <!-- 前にページがある場合の ... -->
            <li class="page-item"
                th:if="${startPage > 1}">
                <span class="page-link">...</span>
            </li>

            <!-- 中央のページ番号 -->
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}"
                th:if="${pageNumber != 0 and pageNumber != books.totalPages - 1}"
                th:classappend="${books.number == pageNumber} ? 'active'">

                <a class="page-link"
                   th:href="@{/book/list(
                       page=${pageNumber},
                       size=${param.size != null ? param.size[0] : 10},
                       sort=${param.sort != null ? param.sort[0] : 'idAsc'},
                       keyword=${param.keyword != null ? param.keyword[0] : ''}
                   )}"
                   th:text="${pageNumber + 1}">
                </a>

            </li>

            <!-- 後ろにページがある場合の ... -->
            <li class="page-item"
                th:if="${endPage < books.totalPages - 2}">
                <span class="page-link">...</span>
            </li>

            <!-- 最終ページ -->
            <li class="page-item"
                th:if="${books.totalPages > 1}"
                th:classappend="${books.number == books.totalPages - 1} ? 'active'">

                <a class="page-link"
                   th:href="@{/book/list(
                       page=${books.totalPages - 1},
                       size=${param.size != null ? param.size[0] : 10},
                       sort=${param.sort != null ? param.sort[0] : 'idAsc'},
                       keyword=${param.keyword != null ? param.keyword[0] : ''}
                   )}"
                   th:text="${books.totalPages}">
                </a>

            </li>
			<li class="page-item ms-2"
			    th:classappend="${books.last} ? 'disabled'">
			
			    <a class="page-link"
			       th:href="@{/book/list(
			           page=${books.number + 1},
			           size=${param.size != null ? param.size[0] : 10},
			           sort=${param.sort != null ? param.sort[0] : 'idAsc'},
			           keyword=${param.keyword != null ? param.keyword[0] : ''}
			       )}">
			        次へ
			    </a>
			</li>
        </ul>
    </nav>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
