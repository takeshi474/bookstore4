<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍リスト</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background-color: #f8f9fa; }
  .table-hover tbody tr:hover { background-color: #f1f5ff; }
</style>
</head>
<body>
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">📚 書籍リスト</h1>
        <a th:href="@{/book/create}" class="btn btn-primary">
            <i class="bi"></i> ＋ 新規作成
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">題名</th>
                        <th scope="col">発行日</th>
                        <th scope="col">価格</th>
                        <th scope="col">メディアタイプ</th>
                        <th scope="col" class="text-end">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book:${books}">
                        <td th:text="${book.id}">1</td>
                        <td th:text="${book.title}" class="fw-semibold">情報倫理</td>
                        <td th:text="${book.date}">2035-03-10</td>
                        <td th:text="${book.price} + ' 円'">3000 円</td>
                        <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${#strings.listJoin(book.mediaType, ', ')}">印刷本</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/book/{id}/edit (id=${book.id})}"
                               class="btn btn-sm btn-outline-secondary">修正</a>
                            <a th:href="@{/book/{id}/delete (id=${book.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('本当に削除しますか？');">削除</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(books)}">
                        <td colspan="6" class="text-center text-muted py-4">登録された書籍がありません。</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
